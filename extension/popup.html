<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="header">
      <p class="title">WellSense Tracker</p>
    </div>

    <div id="signed-out" class="panel">
      <p class="desc">Sign in with your WellSense account to start tracking.</p>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" />
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" />
        <p id="login-error" class="error"></p>
        <button id="login-btn" type="submit">Sign in</button>
      </form>
    </div>

    <div id="signed-in" class="panel hidden">
      <p class="desc">Signed in as <span id="user-email"></span></p>

      <div class="stat-row">
        <span class="stat-label">Current site</span>
        <span id="current-domain" class="stat-value">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Active today</span>
        <span id="active-time" class="stat-value">0 min</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Top category</span>
        <span id="top-category" class="stat-value">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Tab switches</span>
        <span id="tab-switches" class="stat-value">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Compulsive checks</span>
        <span id="compulsive-count" class="stat-value">0</span>
      </div>

      <p class="sync-note">Syncs to your dashboard about once a minute.</p>
      <button id="signout-btn" class="ghost-btn" type="button">Sign out</button>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
